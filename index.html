<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Arc Treasury Dashboard</title>
        <style>
            * { box-sizing: border-box; margin: 0; padding: 0; }
                :root {
                      --bg: #0b1020; --card: rgba(255,255,255,0.05); --border: rgba(255,255,255,0.08);
                            --accent: #4f8cff; --accent2: #18d0e0; --text: #eaf0ff; --muted: #8a93ad;
                                  --green: #2ecc71; --red: #ff6b6b;
                                      }
                                          body {
                                                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
                                                      background: radial-gradient(1200px 600px at 50% -10%, #16204a 0%, var(--bg) 60%);
                                                            color: var(--text); min-height: 100vh; padding: 20px;
                                                                }
                                                                    .wrap { max-width: 760px; margin: 0 auto; }
                                                                        header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
                                                                            .brand { display: flex; align-items: center; gap: 12px; }
                                                                                .brand .logo { font-size: 32px; }
                                                                                    .brand h1 { font-size: 20px; font-weight: 700; }
                                                                                        .brand p { font-size: 12px; color: var(--muted); }
                                                                                            .btn {
                                                                                                  background: linear-gradient(135deg, var(--accent), var(--accent2));
                                                                                                        color: white; border: none; border-radius: 12px; padding: 10px 16px;
                                                                                                              font-weight: 600; cursor: pointer; font-size: 14px;
                                                                                                                  }
                                                                                                                      .btn:active { transform: scale(0.97); }
                                                                                                                          .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 18px; }
                                                                                                                              .card {
                                                                                                                                    background: var(--card); border: 1px solid var(--border);
                                                                                                                                          border-radius: 18px; padding: 18px; backdrop-filter: blur(8px);
                                                                                                                                              }
                                                                                                                                                  .card .label { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
                                                                                                                                                      .card .value { font-size: 22px; font-weight: 700; }
                                                                                                                                                          .hero {
                                                                                                                                                                grid-column: 1 / -1;
                                                                                                                                                                      background: linear-gradient(135deg, var(--accent), var(--accent2));
                                                                                                                                                                            border: none;
                                                                                                                                                                                }
                                                                                                                                                                                    .hero .label { color: rgba(255,255,255,0.85); }
                                                                                                                                                                                        .hero .value { font-size: 34px; }
                                                                                                                                                                                            .addbar { display: flex; gap: 10px; margin-bottom: 18px; }
                                                                                                                                                                                                .addbar input {
                                                                                                                                                                                                      flex: 1; background: rgba(0,0,0,0.25); border: 1px solid var(--border);
                                                                                                                                                                                                            border-radius: 12px; padding: 12px 14px; color: var(--text); font-size: 14px;
                                                                                                                                                                                                                }
                                                                                                                                                                                                                    .addbar input::placeholder { color: var(--muted); }
                                                                                                                                                                                                                        .section-title { font-size: 13px; color: var(--muted); margin: 18px 0 10px; text-transform: uppercase; letter-spacing: 0.5px; }
                                                                                                                                                                                                                            .wallet-row {
                                                                                                                                                                                                                                  display: flex; align-items: center; gap: 10px;
                                                                                                                                                                                                                                        background: var(--card); border: 1px solid var(--border);
                                                                                                                                                                                                                                              border-radius: 14px; padding: 14px; margin-bottom: 10px;
                                                                                                                                                                                                                                                  }
                                                                                                                                                                                                                                                      .wallet-row .w-addr { flex: 1; font-family: monospace; }
                                                                                                                                                                                                                                                          .wallet-row .w-addr a { color: var(--accent2); text-decoration: none; }
                                                                                                                                                                                                                                                              .wallet-row .w-bal { font-weight: 700; }
                                                                                                                                                                                                                                                                  .wallet-row .w-del {
                                                                                                                                                                                                                                                                        background: rgba(255,107,107,0.15); color: var(--red); border: none;
                                                                                                                                                                                                                                                                              border-radius: 8px; width: 30px; height: 30px; cursor: pointer; font-size: 14px;
                                                                                                                                                                                                                                                                                  }
                                                                                                                                                                                                                                                                                      table { width: 100%; border-collapse: collapse; }
                                                                                                                                                                                                                                                                                          th, td { text-align: left; padding: 12px 10px; font-size: 13px; border-bottom: 1px solid var(--border); }
                                                                                                                                                                                                                                                                                              th { color: var(--muted); font-weight: 600; }
                                                                                                                                                                                                                                                                                                  td a { color: var(--accent2); text-decoration: none; }
                                                                                                                                                                                                                                                                                                      .badge { padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 700; }
                                                                                                                                                                                                                                                                                                          .badge.in { background: rgba(46,204,113,0.15); color: var(--green); }
                                                                                                                                                                                                                                                                                                              .badge.out { background: rgba(255,107,107,0.15); color: var(--red); }
                                                                                                                                                                                                                                                                                                                  .muted { color: var(--muted); }
                                                                                                                                                                                                                                                                                                                      .empty { text-align: center; color: var(--muted); padding: 24px; font-size: 14px; }
                                                                                                                                                                                                                                                                                                                          .tablecard { background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 8px 12px; overflow-x: auto; }
                                                                                                                                                                                                                                                                                                                            </style>
                                                                                                                                                                                                                                                                                                                            </head>
                                                                                                                                                                                                                                                                                                                            <body>
                                                                                                                                                                                                                                                                                                                              <div class="wrap">
                                                                                                                                                                                                                                                                                                                                  <header>
                                                                                                                                                                                                                                                                                                                                        <div class="brand">
                                                                                                                                                                                                                                                                                                                                                <span class="logo">📊</span>
                                                                                                                                                                                                                                                                                                                                                        <div>
                                                                                                                                                                                                                                                                                                                                                                  <h1>Arc Treasury</h1>
                                                                                                                                                                                                                                                                                                                                                                            <p>Dashboard USDC • Arc Testnet</p>
                                                                                                                                                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                                                                                                                                          </div>
                                                                                                                                                                                                                                                                                                                                                                                                <button class="btn" id="refresh-btn">🔄 Refresh</button>
                                                                                                                                                                                                                                                                                                                                                                                                    </header>

                                                                                                                                                                                                                                                                                                                                                                                                        <div class="grid">
                                                                                                                                                                                                                                                                                                                                                                                                              <div class="card hero">
                                                                                                                                                                                                                                                                                                                                                                                                                      <div class="label">Total Treasury</div>
                                                                                                                                                                                                                                                                                                                                                                                                                              <div class="value"><span id="total-balance">0.00</span> USDC</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                          <div class="card">
                                                                                                                                                                                                                                                                                                                                                                                                                                                  <div class="label">Jumlah Wallet</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                          <div class="value" id="wallet-count">0</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <div class="card">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <div class="label">Gas Rata-rata</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <div class="value" id="net-gas">-</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <div class="card">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <div class="label">Total TX Arc</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <div class="value" id="net-tx">-</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <div class="card">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <div class="label">Utilisasi Jaringan</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <div class="value" id="net-util">-</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="addbar">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <input id="addr-input" placeholder="Tempel alamat wallet (0x...)" />
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <button class="btn" id="add-btn">+ Tambah</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <div class="section-title">Wallet Treasury</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div id="wallet-list"></div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="section-title">Transaksi Terbaru</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="tablecard">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <table>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <thead>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <tr><th>Tipe</th><th>Jumlah</th><th>Waktu</th><th>Bukti</th></tr>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            </thead>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <tbody id="tx-body"></tbody>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          </table>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <p class="muted" style="text-align:center;margin-top:20px;font-size:11px;">Data real-time dari testnet.arcscan.app (Blockscout)</p>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <script type="module" src="/main.ts"></script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      </html>

<!doctype html>
<html lang="id">
  <head>
      <meta charset="UTF-8" />
          <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <title>Arc Multichain USDC Wallet</title>
                  <style>
                        :root {
                                --bg1: #0b1020;
                                        --bg2: #1a1040;
                                                --accent: #6c5ce7;
                                                        --accent2: #00d2ff;
                                                                --card: rgba(255, 255, 255, 0.07);
                                                                        --text: #f5f6fa;
                                                                                --muted: #9aa0b4;
                                                                                      }
                                                                                            * { box-sizing: border-box; margin: 0; padding: 0; }
                                                                                                  body {
                                                                                                          font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
                                                                                                                  min-height: 100vh;
                                                                                                                          background: radial-gradient(circle at 20% 10%, var(--bg2), var(--bg1));
                                                                                                                                  color: var(--text);
                                                                                                                                          display: flex;
                                                                                                                                                  align-items: center;
                                                                                                                                                          justify-content: center;
                                                                                                                                                                  padding: 20px;
                                                                                                                                                                        }
                                                                                                                                                                              .wallet-card {
                                                                                                                                                                                      width: 100%;
                                                                                                                                                                                              max-width: 420px;
                                                                                                                                                                                                      background: var(--card);
                                                                                                                                                                                                              backdrop-filter: blur(14px);
                                                                                                                                                                                                                      border: 1px solid rgba(255, 255, 255, 0.12);
                                                                                                                                                                                                                              border-radius: 24px;
                                                                                                                                                                                                                                      padding: 28px;
                                                                                                                                                                                                                                              box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
                                                                                                                                                                                                                                                    }
                                                                                                                                                                                                                                                          .logo { font-size: 40px; text-align: center; }
                                                                                                                                                                                                                                                                h1 { font-size: 20px; text-align: center; margin: 8px 0 4px; }
                                                                                                                                                                                                                                                                      .subtitle { text-align: center; color: var(--muted); font-size: 13px; margin-bottom: 20px; }
                                                                                                                                                                                                                                                                            .balance-box {
                                                                                                                                                                                                                                                                                    background: linear-gradient(135deg, var(--accent), var(--accent2));
                                                                                                                                                                                                                                                                                            border-radius: 18px;
                                                                                                                                                                                                                                                                                                    padding: 20px;
                                                                                                                                                                                                                                                                                                            text-align: center;
                                                                                                                                                                                                                                                                                                                    margin-bottom: 20px;
                                                                                                                                                                                                                                                                                                                          }
                                                                                                                                                                                                                                                                                                                                .balance-label { font-size: 12px; opacity: 0.85; }
                                                                                                                                                                                                                                                                                                                                      #balance { font-size: 30px; font-weight: 700; margin-top: 4px; }
                                                                                                                                                                                                                                                                                                                                            .field { margin-bottom: 14px; }
                                                                                                                                                                                                                                                                                                                                                  label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 6px; }
                                                                                                                                                                                                                                                                                                                                                        input {
                                                                                                                                                                                                                                                                                                                                                                width: 100%;
                                                                                                                                                                                                                                                                                                                                                                        padding: 14px 16px;
                                                                                                                                                                                                                                                                                                                                                                                border-radius: 14px;
                                                                                                                                                                                                                                                                                                                                                                                        border: 1px solid rgba(255, 255, 255, 0.15);
                                                                                                                                                                                                                                                                                                                                                                                                background: rgba(0, 0, 0, 0.25);
                                                                                                                                                                                                                                                                                                                                                                                                        color: var(--text);
                                                                                                                                                                                                                                                                                                                                                                                                                font-size: 15px;
                                                                                                                                                                                                                                                                                                                                                                                                                        outline: none;
                                                                                                                                                                                                                                                                                                                                                                                                                              }
                                                                                                                                                                                                                                                                                                                                                                                                                                    input:focus { border-color: var(--accent2); }
                                                                                                                                                                                                                                                                                                                                                                                                                                          button {
                                                                                                                                                                                                                                                                                                                                                                                                                                                  width: 100%;
                                                                                                                                                                                                                                                                                                                                                                                                                                                          padding: 15px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                  border: none;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                          border-radius: 14px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  font-size: 15px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          font-weight: 600;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  cursor: pointer;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          transition: transform 0.1s, opacity 0.2s;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  color: #fff;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              button:active { transform: scale(0.98); }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    #connect { background: rgba(255, 255, 255, 0.12); margin-bottom: 14px; }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          #send { background: linear-gradient(135deg, var(--accent), var(--accent2)); margin-top: 6px; }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                #address { text-align: center; font-size: 13px; color: var(--muted); margin-bottom: 18px; }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      #log {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              margin-top: 16px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      font-size: 13px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              min-height: 20px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      word-break: break-all;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              color: var(--accent2);
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      text-align: center;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </style>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </head>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="wallet-card" id="wallet-card">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <div class="logo">👛</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <h1>Arc Multichain Wallet</h1>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          <p class="subtitle">Kirim USDC di Arc Testnet</p>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <button id="connect">🔌 Connect Wallet</button>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <div id="address">Belum terhubung</div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="balance-box">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="balance-label">Unified Balance</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div id="balance">— USDC</div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="field">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <label for="to">Alamat tujuan</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <input id="to" placeholder="0x..." />
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <div class="field">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <label for="amount">Jumlah (USDC)</label>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <input id="amount" placeholder="1.00" />
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <button id="send">Kirim USDC di Arc</button>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      <div id="log"></div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          </div>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              <script type="module" src="/main.ts"></script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </body>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                </html>
